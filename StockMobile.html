<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SZFashion Stock</title>
    <style>
      :root {
        --bg: #f7f3ec;
        --surface: #fffdf8;
        --ink: #211b16;
        --muted: #726557;
        --line: rgba(58, 40, 25, 0.12);
        --shadow: 0 16px 36px rgba(76, 52, 33, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(180deg, #fbf8f2 0%, #efe6d8 100%);
        color: var(--ink);
        font-family: "Avenir Next", "Segoe UI", sans-serif;
      }

      .app {
        max-width: 720px;
        margin: 0 auto;
        padding: 18px 14px 28px;
      }

      .panel {
        padding: 18px;
        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: 22px;
        background: rgba(255, 253, 248, 0.96);
        box-shadow: var(--shadow);
      }

      .eyebrow {
        margin: 0 0 8px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }

      h1 {
        margin: 0;
        font-size: 26px;
        line-height: 1.08;
        letter-spacing: -0.03em;
      }

      .status {
        margin-top: 10px;
        min-height: 24px;
        color: var(--muted);
        font-size: 14px;
      }

      .status.error {
        color: #a32727;
      }

      .list {
        display: grid;
        gap: 10px;
        margin-top: 16px;
      }

      .item {
        padding: 15px 16px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--surface);
        box-shadow: 0 8px 22px rgba(76, 52, 33, 0.05);
      }

      .ref {
        margin: 0;
        font-size: 17px;
        font-weight: 700;
        line-height: 1.3;
        word-break: break-word;
      }

      .empty {
        padding: 18px;
        border: 1px dashed rgba(58, 40, 25, 0.18);
        border-radius: 18px;
        text-align: center;
        color: var(--muted);
        background: rgba(255, 253, 248, 0.7);
      }

      .loading {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .loading::before {
        content: "";
        width: 12px;
        height: 12px;
        border-radius: 999px;
        border: 2px solid rgba(58, 40, 25, 0.15);
        border-top-color: rgba(58, 40, 25, 0.6);
        animation: spin 0.9s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="panel">
        <p class="eyebrow">Stock mobile</p>
        <h1>Liste des references</h1>
        <div id="status" class="status"></div>
      </section>

      <section id="list" class="list" aria-live="polite"></section>
    </main>

    <script>
      const els = {
        list: document.getElementById("list"),
        status: document.getElementById("status")
      };

      function init() {
        setLoading();
        google.script.run
          .withSuccessHandler(onLoadSuccess)
          .withFailureHandler(onLoadFailure)
          .StockWebApp_getList_();
      }

      function setLoading() {
        els.status.className = "status";
        els.status.innerHTML = '<span class="loading">Chargement des references...</span>';
        els.list.innerHTML = "";
      }

      function onLoadSuccess(payload) {
        const items = Array.isArray(payload && payload.items) ? payload.items : [];

        if (!items.length) {
          els.status.className = "status";
          els.status.textContent = "Aucune reference exploitable dans STOCK.";
          els.list.innerHTML = '<div class="empty">Aucune reference trouvee.</div>';
          return;
        }

        const suffix = items.length > 1 ? "s" : "";
        els.status.className = "status";
        els.status.textContent = items.length + " reference" + suffix + " chargee" + suffix + ".";
        els.list.innerHTML = items.map(function(item) {
          return '<div class="item"><p class="ref">' + escapeHtml(item.reference || "-") + '</p></div>';
        }).join("");
      }

      function onLoadFailure(error) {
        const message = error && error.message ? error.message : String(error || "Erreur inconnue");
        els.status.className = "status error";
        els.status.textContent = message;
        els.list.innerHTML = "";
      }

      function escapeHtml(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/\"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      init();
    </script>
  </body>
</html>
