    <script>
      (function() {
        const bootElement = document.getElementById("inventory-boot");
        const boot = bootElement ? JSON.parse(bootElement.textContent || "{}") : {};
        const initialPayload = boot && boot.payload ? boot.payload : {};

        const state = {
          items: Array.isArray(initialPayload.items) ? initialPayload.items.slice() : [],
          filters: initialPayload.filters || {},
          summary: initialPayload.summary || {},
          generatedAt: initialPayload.generatedAt || "",
          query: "",
          stockState: "all",
          warehouse: "",
          sort: initialPayload.ui && initialPayload.ui.defaultSort ? initialPayload.ui.defaultSort : "ref_asc",
          columnCount: 2,
          isRefreshing: false,
          filterPanelOpen: false,
          lastError: "",
          quickEditOpen: false,
          quickEditItem: null,
          quickEditForm: null
        };

        const els = {
          grid: document.getElementById("inventoryGrid"),
          inventoryScroll: document.getElementById("inventoryScroll"),
          emptyState: document.getElementById("emptyState"),
          searchInput: document.getElementById("searchInput"),
          refreshButton: document.getElementById("refreshButton"),
          toggleFilterButton: document.getElementById("toggleFilterButton"),
          toggleSortButton: document.getElementById("toggleSortButton"),
          utilityPanel: document.getElementById("utilityPanel"),
          stockStateFilter: document.getElementById("stockStateFilter"),
          warehouseFilter: document.getElementById("warehouseFilter"),
          warehouseFilterWrap: document.getElementById("warehouseFilterWrap"),
          sortSelect: document.getElementById("sortSelect"),
          sortBadge: document.getElementById("sortBadge"),
          summaryDate: document.getElementById("summaryDate"),
          summaryRefs: document.getElementById("summaryRefs"),
          summaryPositive: document.getElementById("summaryPositive"),
          summaryZero: document.getElementById("summaryZero"),
          summaryTotals: document.getElementById("summaryTotals"),
          summaryStatus: document.getElementById("summaryStatus"),
          activeFilters: document.getElementById("activeFilters"),
          quickEditOverlay: document.getElementById("quickEditOverlay"),
          quickEditModal: document.getElementById("quickEditModal"),
          quickEditForm: document.getElementById("quickEditForm"),
          quickEditReference: document.getElementById("quickEditReference"),
          quickEditStockDisplay: document.getElementById("quickEditStockDisplay"),
          quickEditTail: document.getElementById("quickEditTail"),
          quickEditUnitsPerBox: document.getElementById("quickEditUnitsPerBox"),
          quickEditItemBoxes: document.getElementById("quickEditItemBoxes"),
          quickEditSign: document.getElementById("quickEditSign"),
          quickEditFractionText: document.getElementById("quickEditFractionText"),
          quickEditFractionHint: document.getElementById("quickEditFractionHint"),
          quickEditCancel: document.getElementById("quickEditCancel"),
          quickEditSave: document.getElementById("quickEditSave")
        };

        function escapeHtml(value) {
          return String(value == null ? "" : value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");
        }

        function renderItemMarkup(item) {
          const reference = item && item.reference ? item.reference : "-";
          const stockDisplay = item && item.stockDisplay ? item.stockDisplay : "-";
          const itemId = item && item.id ? item.id : reference;
          const accentClass = item && item.stockState === "positive" ? "border-emerald-400/50" : "border-rose-400/50";
          const stockClass = item && item.stockState === "positive" ? "text-primary" : "text-on-surface-variant";

          return '' +
            '<article class="inventory-card bg-surface-container-lowest relative border-l-4 ' + accentClass + ' flex min-h-[4.1rem] items-stretch transition-colors duration-150 hover:bg-surface-container select-none" data-item-id="' + escapeHtml(itemId) + '" data-reference="' + escapeHtml(reference) + '" data-stock-display="' + escapeHtml(stockDisplay) + '" data-stock-state="' + escapeHtml(item && item.stockState ? item.stockState : "zero") + '">' +
              '<button class="inventory-card-main flex min-w-0 flex-1 flex-col justify-between px-2.5 py-2 text-left" type="button" data-action="open-quick-edit" data-item-id="' + escapeHtml(itemId) + '">' +
                '<div class="flex items-start gap-2">' +
                  '<span class="truncate pr-2 text-[12px] font-bold tracking-tight text-on-surface">' + escapeHtml(reference) + '</span>' +
                '</div>' +
                '<div class="mt-1.5">' +
                  '<span class="block truncate text-[13px] font-medium ' + stockClass + '">' + escapeHtml(stockDisplay) + '</span>' +
                '</div>' +
              '</button>' +
              '<button class="reference-detail-trigger flex w-10 shrink-0 touch-manipulation select-none items-center justify-center border-l border-outline-variant/20 text-outline-variant transition-colors duration-150 hover:bg-surface-container-highest hover:text-on-surface-variant active:bg-surface-container-high" type="button" aria-label="Ouvrir la fiche de ' + escapeHtml(reference) + '" data-action="open-detail" data-item-id="' + escapeHtml(itemId) + '" data-reference="' + escapeHtml(reference) + '">' +
                '<span class="material-symbols-outlined !text-[16px]">chevron_right</span>' +
              '</button>' +
            '</article>';
        }

        function renderColumnLayoutMarkup(columns) {
          if (!columns.length) return "";
          return '<div class="flex items-start gap-px bg-outline-variant/20">' + columns.map(function(columnItems) {
            return '<div class="inventory-column flex min-w-0 flex-1 flex-col gap-px bg-outline-variant/20">' +
              columnItems.map(renderItemMarkup).join("") +
            '</div>';
          }).join("") + '</div>';
        }

        function formatDateLabel(isoText) {
          if (!isoText) return "--/--/----";
          const date = new Date(isoText);
          if (Number.isNaN(date.getTime())) return "--/--/----";
          return new Intl.DateTimeFormat("fr-FR", {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
          }).format(date);
        }

        function normalizeText(value) {
          return String(value || "").toLowerCase().trim();
        }

        function toPositiveNumber(value) {
          const numeric = Number(value);
          return Number.isFinite(numeric) && numeric > 0 ? numeric : 0;
        }

        function parseFraction(text) {
          const normalized = String(text || "").trim().replace(/\s+/g, "");
          if (!normalized) return 0;
          const fractionMatch = normalized.match(/^(\d+)\/(\d+)$/);
          if (fractionMatch) {
            const numerator = Number(fractionMatch[1]);
            const denominator = Number(fractionMatch[2]);
            return denominator > 0 ? numerator / denominator : 0;
          }
          const numeric = Number(normalized.replace(",", "."));
          return Number.isFinite(numeric) && numeric > 0 ? numeric : 0;
        }

        function formatMetricNumber(value) {
          const numeric = Number(value || 0);
          if (!Number.isFinite(numeric) || numeric <= 0) return "0";
          return String(Math.max(0, Math.floor(numeric)));
        }

        function computeInventoryTotals_(items) {
          return (items || []).reduce(function(acc, item) {
            const tail = toPositiveNumber(item && item.tail);
            const unitsPerBox = toPositiveNumber(item && item.unitsPerBox);
            const itemBoxes = toPositiveNumber(item && item.itemBoxes);
            const sign = String(item && item.sign ? item.sign : "").trim();
            const fractionValue = toPositiveNumber(item && item.fractionValue) || parseFraction(item && item.fractionText);
            const colisage = toPositiveNumber(item && item.colisage);
            let itemPieces = tail;
            let cartonCount = tail > 0 ? 1 : 0;

            if (unitsPerBox > 0) {
              if (sign === "+") {
                itemPieces += (unitsPerBox * itemBoxes) + (unitsPerBox * fractionValue);
                cartonCount += itemBoxes + (fractionValue > 0 ? 1 : 0);
              } else if (sign === "×") {
                if (itemBoxes > 1) {
                  itemPieces += unitsPerBox * itemBoxes * fractionValue;
                  cartonCount += itemBoxes;
                } else if (itemBoxes > 0) {
                  itemPieces += unitsPerBox * fractionValue;
                  cartonCount += itemBoxes;
                } else if (fractionValue > 0) {
                  itemPieces += unitsPerBox * fractionValue;
                  cartonCount += 1;
                }
              } else {
                itemPieces += unitsPerBox * itemBoxes;
                cartonCount += itemBoxes;
                if (fractionValue > 0) cartonCount += 1;
              }
            } else if (fractionValue > 0 && itemBoxes <= 0) {
              cartonCount += 1;
            }

            acc.totalPieces += itemPieces;
            acc.totalBoxes += cartonCount;

            if (colisage > 0) {
              acc.totalPacks += Math.floor(itemPieces / colisage);
              acc.hasPackData = true;
            }

            return acc;
          }, {
            totalBoxes: 0,
            totalPieces: 0,
            totalPacks: 0,
            hasPackData: false
          });
        }

        function getActiveFilterLabels() {
          const labels = [];
          if (state.query) labels.push("Recherche: " + state.query);
          if (state.stockState === "positive") labels.push("En stock");
          if (state.stockState === "zero") labels.push("En rupture");
          if (state.warehouse) labels.push(state.warehouse);
          return labels;
        }

        function compareBySortKey(left, right) {
          const leftSortKey = String(left && left.sortKey ? left.sortKey : "").trim();
          const rightSortKey = String(right && right.sortKey ? right.sortKey : "").trim();
          const leftRef = String(left && left.reference ? left.reference : "");
          const rightRef = String(right && right.reference ? right.reference : "");

          if (leftSortKey && rightSortKey && leftSortKey !== rightSortKey) {
            return leftSortKey.localeCompare(rightSortKey);
          }
          if (leftSortKey && !rightSortKey) return -1;
          if (!leftSortKey && rightSortKey) return 1;
          return leftRef.localeCompare(rightRef);
        }

        function sortItems(items) {
          const next = items.slice();
          if (state.sort === "ref_desc") {
            next.sort(function(a, b) {
              return -compareBySortKey(a, b);
            });
            return next;
          }

          if (state.sort === "stock_first") {
            next.sort(function(a, b) {
              const leftState = a && a.stockState === "positive" ? 0 : 1;
              const rightState = b && b.stockState === "positive" ? 0 : 1;
              if (leftState !== rightState) return leftState - rightState;
              return compareBySortKey(a, b);
            });
            return next;
          }

          next.sort(function(a, b) {
            return compareBySortKey(a, b);
          });
          return next;
        }

        function getColumnCount() {
          const width = window.innerWidth || document.documentElement.clientWidth || 0;
          const isLandscape = width > (window.innerHeight || 0);
          if (width >= 980) return 4;
          if (width >= 720 || (isLandscape && width >= 560)) return 3;
          return 2;
        }

        function buildColumnLayout_(items, columnCount) {
          const normalizedCount = Math.max(1, Math.trunc(Number(columnCount) || 1));
          if (!items.length) return [];

          const itemsPerColumn = Math.ceil(items.length / normalizedCount);
          const columns = [];
          for (let i = 0; i < normalizedCount; i++) {
            const start = i * itemsPerColumn;
            const slice = items.slice(start, start + itemsPerColumn);
            if (slice.length) columns.push(slice);
          }
          return columns;
        }

        function getVisibleItems() {
          const query = normalizeText(state.query);
          return sortItems(state.items.filter(function(item) {
            if (state.stockState !== "all" && String(item.stockState || "") !== state.stockState) return false;
            if (state.warehouse && String(item.warehouse || "") !== state.warehouse) return false;
            if (!query) return true;

            const haystack = [
              item.reference || "",
              item.stockDisplay || ""
            ].join(" ").toLowerCase();
            return haystack.indexOf(query) !== -1;
          }));
        }

        function renderActiveFilters() {
          const labels = getActiveFilterLabels();
          els.activeFilters.innerHTML = labels.map(function(label) {
            return '<span class="inline-flex items-center border border-outline-variant/20 bg-surface-container-lowest px-2 py-1 text-[9px] font-bold uppercase tracking-[0.16em] text-on-surface-variant">' + escapeHtml(label) + '</span>';
          }).join("");
        }

        function sanitizeIntegerInput(value) {
          if (value === "" || value == null) return "";
          const normalized = String(value).trim();
          if (!normalized) return "";
          const numeric = Number(normalized);
          if (!Number.isFinite(numeric) || numeric < 0) return "";
          return String(Math.trunc(numeric));
        }

        function sanitizeSign(value) {
          return value === "×" ? "×" : "+";
        }

        function sanitizeFractionText(value) {
          const normalized = String(value || "").trim().replace(/\s+/g, "");
          if (!normalized) return "";
          return /^(\d+)\/(\d+)$/.test(normalized) ? normalized : normalized;
        }

        function isFractionTextValid(value) {
          const normalized = String(value || "").trim();
          return !normalized || /^(\d+)\/(\d+)$/.test(normalized);
        }

        function getItemById(itemId) {
          const normalizedId = String(itemId || "").trim();
          if (!normalizedId) return null;
          return state.items.find(function(item) {
            return String(item && item.id ? item.id : "") === normalizedId;
          }) || null;
        }

        function renderQuickEdit() {
          const isOpen = !!state.quickEditOpen && !!state.quickEditItem;
          els.quickEditOverlay.classList.toggle("hidden", !isOpen);
          els.quickEditOverlay.classList.toggle("flex", isOpen);
          if (!isOpen) return;

          const item = state.quickEditItem || {};
          const form = state.quickEditForm || {};
          els.quickEditReference.textContent = item.reference || "-";
          els.quickEditStockDisplay.textContent = item.stockDisplay || "-";
          els.quickEditTail.value = form.tail;
          els.quickEditUnitsPerBox.value = form.unitsPerBox;
          els.quickEditItemBoxes.value = form.itemBoxes;
          els.quickEditSign.value = sanitizeSign(form.sign);
          els.quickEditFractionText.value = form.fractionText;
          els.quickEditFractionHint.textContent = isFractionTextValid(form.fractionText)
            ? "Format attendu: 1/2, 2/3, 3/4"
            : "Format invalide. Exemple: 1/2";
          els.quickEditFractionHint.className = "mt-1 block text-[10px] " + (isFractionTextValid(form.fractionText) ? "text-on-surface-variant" : "text-error");
        }

        function openQuickEdit(item) {
          if (!item) return;
          state.quickEditItem = item;
          state.quickEditOpen = true;
          state.quickEditForm = {
            tail: sanitizeIntegerInput(item.tail),
            unitsPerBox: sanitizeIntegerInput(item.unitsPerBox),
            itemBoxes: sanitizeIntegerInput(item.itemBoxes),
            sign: sanitizeSign(item.sign),
            fractionText: sanitizeFractionText(item.fractionText)
          };
          renderQuickEdit();
          window.setTimeout(function() {
            els.quickEditTail.focus();
            els.quickEditTail.select();
          }, 0);
        }

        function closeQuickEdit() {
          state.quickEditOpen = false;
          state.quickEditItem = null;
          state.quickEditForm = null;
          renderQuickEdit();
        }

        function handleQuickEditFieldChange(field, value) {
          if (!state.quickEditForm) return;
          if (field === "sign") {
            state.quickEditForm.sign = sanitizeSign(value);
          } else if (field === "fractionText") {
            state.quickEditForm.fractionText = sanitizeFractionText(value);
          } else {
            state.quickEditForm[field] = sanitizeIntegerInput(value);
          }
          renderQuickEdit();
        }

        function handleQuickEditSave() {
          if (!state.quickEditForm) return;
          if (!isFractionTextValid(state.quickEditForm.fractionText)) {
            renderQuickEdit();
            return;
          }
          state.lastError = "";
          els.summaryStatus.textContent = "Quick edit bientot disponible";
          closeQuickEdit();
        }

        function handleOpenReferenceDetail(reference) {
          const normalizedReference = String(reference || "").trim();
          if (!normalizedReference) return;
          state.lastError = "";
          els.summaryStatus.textContent = "Fiche " + normalizedReference + " bientot";
        }

        function renderSummary(visibleItems) {
          const positiveCount = visibleItems.filter(function(item) {
            return item && item.stockState === "positive";
          }).length;
          const totals = computeInventoryTotals_(visibleItems);
          const totalLoaded = state.summary && state.summary.totalRows ? state.summary.totalRows : state.items.length;
          const refsText = state.summary && state.summary.isPartial && state.items.length < totalLoaded
            ? visibleItems.length + " / " + totalLoaded + " " + (visibleItems.length === 1 ? "ref" : "refs")
            : visibleItems.length + " " + (visibleItems.length === 1 ? "ref" : "refs");
          const summarySegments = [
            formatMetricNumber(totals.totalBoxes) + " 箱"
          ];

          if (totals.hasPackData && totals.totalPacks > 0) {
            summarySegments.push(formatMetricNumber(totals.totalPacks) + " 包");
          }
          summarySegments.push(formatMetricNumber(totals.totalPieces) + " 件");

          els.summaryDate.textContent = formatDateLabel(state.generatedAt || (state.summary && state.summary.generatedAt) || "");
          els.summaryRefs.textContent = refsText;
          els.summaryPositive.textContent = positiveCount + " en stock";
          els.summaryZero.textContent = Math.max(0, visibleItems.length - positiveCount) + " en rupture";
          els.summaryTotals.textContent = summarySegments.join(" ");

          if (state.isRefreshing) {
            els.summaryStatus.textContent = "Refresh...";
          } else if (state.lastError) {
            els.summaryStatus.textContent = state.lastError;
          } else if (getActiveFilterLabels().length) {
            els.summaryStatus.textContent = "Filtres actifs";
          } else if (state.summary && state.summary.isPartial) {
            els.summaryStatus.textContent = "Lot initial";
          } else {
            els.summaryStatus.textContent = "Pret";
          }
        }

        function renderGrid() {
          const visibleItems = getVisibleItems();
          const columns = buildColumnLayout_(visibleItems, state.columnCount);
          els.grid.innerHTML = renderColumnLayoutMarkup(columns);
          els.emptyState.classList.toggle("hidden", visibleItems.length > 0);
          renderSummary(visibleItems);
          renderActiveFilters();
        }

        function syncUtilityPanel() {
          els.utilityPanel.classList.toggle("hidden", !state.filterPanelOpen);
          els.sortSelect.value = state.sort;
          els.stockStateFilter.value = state.stockState;
          els.sortBadge.textContent = state.sort === "ref_desc" ? "REF DESC" : (state.sort === "stock_first" ? "STOCK" : "REF ASC");
        }

        function populateWarehouseFilter() {
          const warehouses = state.filters && Array.isArray(state.filters.warehouses) ? state.filters.warehouses : [];
          els.warehouseFilter.innerHTML = '<option value="">Tous</option>' + warehouses.map(function(value) {
            return '<option value="' + escapeHtml(value) + '">' + escapeHtml(value) + '</option>';
          }).join("");
          els.warehouseFilter.value = state.warehouse;
          els.warehouseFilterWrap.classList.toggle("hidden", warehouses.length === 0);
        }

        function hydrate(payload) {
          state.items = Array.isArray(payload && payload.items) ? payload.items.slice() : [];
          state.filters = payload && payload.filters ? payload.filters : {};
          state.summary = payload && payload.summary ? payload.summary : {};
          state.generatedAt = payload && payload.generatedAt ? payload.generatedAt : "";
          state.lastError = "";
          populateWarehouseFilter();
          syncUtilityPanel();
          renderGrid();
        }

        function syncColumnLayout(force) {
          const nextCount = getColumnCount();
          if (!force && nextCount === state.columnCount) return;
          state.columnCount = nextCount;
          renderGrid();
        }

        function runRefresh(isAuto) {
          if (state.isRefreshing) return;
          if (typeof google === "undefined" || !google.script || !google.script.run) return;
          state.isRefreshing = true;
          state.lastError = "";
          renderSummary(getVisibleItems());

          google.script.run
            .withSuccessHandler(function(payload) {
              state.isRefreshing = false;
              hydrate(payload || {});
            })
            .withFailureHandler(function(error) {
              state.isRefreshing = false;
              state.lastError = error && error.message ? error.message : "Erreur de rafraichissement";
              renderGrid();
            })
            .StockWebApp_getList();

          if (isAuto) {
            els.summaryStatus.textContent = "Sync...";
          }
        }

        els.searchInput.addEventListener("input", function(event) {
          state.query = String(event.target.value || "").trim();
          renderGrid();
        });

        els.refreshButton.addEventListener("click", function() {
          runRefresh(false);
        });

        els.grid.addEventListener("click", function(event) {
          const trigger = event.target.closest('[data-action="open-detail"]');
          if (trigger) {
            event.preventDefault();
            event.stopPropagation();
            handleOpenReferenceDetail(trigger.getAttribute("data-reference"));
            return;
          }

          const quickEditTrigger = event.target.closest('[data-action="open-quick-edit"]');
          if (!quickEditTrigger) return;
          event.preventDefault();
          const item = getItemById(quickEditTrigger.getAttribute("data-item-id"));
          if (item) openQuickEdit(item);
        });

        els.toggleFilterButton.addEventListener("click", function() {
          state.filterPanelOpen = !state.filterPanelOpen;
          syncUtilityPanel();
        });

        els.toggleSortButton.addEventListener("click", function() {
          state.filterPanelOpen = true;
          syncUtilityPanel();
          els.sortSelect.focus();
        });

        els.stockStateFilter.addEventListener("change", function(event) {
          state.stockState = event.target.value || "all";
          renderGrid();
        });

        els.warehouseFilter.addEventListener("change", function(event) {
          state.warehouse = event.target.value || "";
          renderGrid();
        });

        els.sortSelect.addEventListener("change", function(event) {
          state.sort = event.target.value || "ref_asc";
          syncUtilityPanel();
          renderGrid();
        });

        els.quickEditTail.addEventListener("input", function(event) {
          handleQuickEditFieldChange("tail", event.target.value);
        });

        els.quickEditUnitsPerBox.addEventListener("input", function(event) {
          handleQuickEditFieldChange("unitsPerBox", event.target.value);
        });

        els.quickEditItemBoxes.addEventListener("input", function(event) {
          handleQuickEditFieldChange("itemBoxes", event.target.value);
        });

        els.quickEditSign.addEventListener("change", function(event) {
          handleQuickEditFieldChange("sign", event.target.value);
        });

        els.quickEditFractionText.addEventListener("input", function(event) {
          handleQuickEditFieldChange("fractionText", event.target.value);
        });

        els.quickEditCancel.addEventListener("click", function() {
          closeQuickEdit();
        });

        els.quickEditSave.addEventListener("click", function() {
          handleQuickEditSave();
        });

        els.quickEditOverlay.addEventListener("click", function(event) {
          if (event.target === els.quickEditOverlay) {
            closeQuickEdit();
          }
        });

        document.addEventListener("keydown", function(event) {
          if (event.key === "Escape" && state.quickEditOpen) {
            closeQuickEdit();
          }
        });

        let resizeTimer = 0;
        window.addEventListener("resize", function() {
          window.clearTimeout(resizeTimer);
          resizeTimer = window.setTimeout(function() {
            syncColumnLayout(false);
          }, 100);
        });

        state.columnCount = 2;
        hydrate(initialPayload);
        renderQuickEdit();
        window.setTimeout(function() {
          syncColumnLayout(false);
        }, 0);

        if (state.summary && state.summary.isPartial) {
          window.setTimeout(function() {
            runRefresh(true);
          }, 250);
        }
      })();
    </script>
  </body>
</html>
