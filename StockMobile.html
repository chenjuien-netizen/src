<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SZFashion Stock</title>
    <style>
      :root {
        --bg: #f5f5f5;
        --surface: #ffffff;
        --surface-soft: #f8f9fb;
        --ink: #202124;
        --muted: #5f6368;
        --line: #e6e9ef;
        --brand: #1a73e8;
        --brand-soft: #e8f0fe;
        --danger: #b3261e;
        --shadow: 0 4px 16px rgba(32, 33, 36, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      html {
        height: 100%;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family: Roboto, "Segoe UI", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      .app {
        min-height: 100vh;
        background: var(--bg);
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 56px;
        padding: max(10px, env(safe-area-inset-top)) 16px 10px;
        background: rgba(255, 255, 255, 0.96);
        border-bottom: 1px solid var(--line);
        backdrop-filter: blur(10px);
      }

      .topbar-icon {
        width: 24px;
        height: 24px;
        flex: 0 0 24px;
        color: var(--muted);
      }

      .topbar-title {
        min-width: 0;
        flex: 1 1 auto;
      }

      .topbar-title p {
        margin: 0;
      }

      .eyebrow {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      h1 {
        margin: 2px 0 0;
        font-size: 20px;
        line-height: 1.2;
        font-weight: 500;
        letter-spacing: -0.01em;
      }

      .content {
        width: 100%;
        max-width: 720px;
        margin: 0 auto;
        padding: 14px 12px calc(28px + env(safe-area-inset-bottom));
      }

      .hero {
        margin-bottom: 12px;
        padding: 14px;
        border-radius: 18px;
        background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
      }

      .hero-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .hero-label {
        margin: 0;
        font-size: 13px;
        color: var(--muted);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 34px;
        padding: 4px 10px;
        border-radius: 999px;
        background: var(--brand-soft);
        color: var(--brand);
        font-size: 13px;
        font-weight: 700;
        white-space: nowrap;
      }

      .status {
        margin-top: 8px;
        min-height: 20px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      .status.error {
        color: var(--danger);
      }

      .list {
        display: grid;
        gap: 7px;
      }

      .item {
        display: block;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--surface);
        box-shadow: 0 2px 10px rgba(32, 33, 36, 0.05);
        transition: transform 0.08s ease, background 0.1s ease;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      .item:active {
        transform: scale(0.98);
        background: #f1f3f4;
      }

      .ref {
        margin: 0;
        font-size: 16px;
        font-weight: 700;
        line-height: 1.25;
        word-break: break-word;
      }

      .item-secondary {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 4px;
        min-height: 0;
      }

      .item-stock {
        font-size: 13px;
        line-height: 1.25;
        font-weight: 700;
        color: var(--ink);
      }

      .item-warehouse {
        display: inline-flex;
        align-items: center;
        padding: 2px 7px;
        border-radius: 999px;
        background: var(--surface-soft);
        color: var(--muted);
        font-size: 10px;
        line-height: 1.2;
        font-weight: 700;
        letter-spacing: 0.03em;
        text-transform: uppercase;
      }

      .item-tertiary {
        margin-top: 3px;
        font-size: 11px;
        line-height: 1.25;
        color: #80868b;
      }

      .empty {
        padding: 18px;
        border: 1px dashed #c8ced8;
        border-radius: 16px;
        text-align: center;
        color: var(--muted);
        background: rgba(255, 255, 255, 0.88);
      }

      .loading {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .loading::before {
        content: "";
        width: 14px;
        height: 14px;
        border-radius: 999px;
        border: 2px solid rgba(26, 115, 232, 0.2);
        border-top-color: var(--brand);
        animation: spin 0.9s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (min-width: 721px) {
        .content {
          padding-left: 16px;
          padding-right: 16px;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <svg class="topbar-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h12v2H3v-2z"/>
        </svg>
        <div class="topbar-title">
          <p class="eyebrow">Stock mobile</p>
          <h1>Liste des références</h1>
        </div>
      </header>

      <section class="content">
        <section class="hero">
          <div class="hero-row">
            <p class="hero-label">Références disponibles</p>
            <span id="countBadge" class="badge">--</span>
          </div>
          <div id="status" class="status"></div>
        </section>

        <section id="list" class="list" aria-live="polite"></section>
      </section>
    </main>

    <script>
      const els = {
        list: document.getElementById("list"),
        status: document.getElementById("status"),
        countBadge: document.getElementById("countBadge")
      };
      let restoreStatusTimeout = null;

      function init() {
        setLoading();
        google.script.run
          .withSuccessHandler(onLoadSuccess)
          .withFailureHandler(onLoadFailure)
          .StockWebApp_getList();
      }

      function setLoading() {
        els.status.className = "status";
        els.status.innerHTML = '<span class="loading">Chargement des références...</span>';
        els.countBadge.textContent = "...";
        els.list.innerHTML = "";
      }

      function onLoadSuccess(payload) {
        const items = Array.isArray(payload && payload.items) ? payload.items : [];

        if (!items.length) {
          els.status.className = "status";
          els.status.textContent = "Aucune référence exploitable dans STOCK.";
          els.countBadge.textContent = "0";
          els.list.innerHTML = '<div class="empty">Aucune référence trouvée.</div>';
          return;
        }

        const suffix = items.length > 1 ? "s" : "";
        els.status.className = "status";
        els.status.textContent = items.length + " référence" + suffix + " chargée" + suffix + ".";
        els.countBadge.textContent = String(items.length);
        els.list.innerHTML = items.map(function(item) {
          const hasSecondaryLine = !!(item.stockDisplay || item.warehouse);
          const hasTertiaryLine = !!item.arrivageRef;
          return '' +
            '<article class="item" data-reference="' + escapeHtml(item.reference || "") + '" tabindex="0" role="button" aria-label="Copier ' + escapeHtml(item.reference || "") + '">' +
              '<p class="ref">' + escapeHtml(item.reference || "-") + '</p>' +
              (hasSecondaryLine
                ? '<div class="item-secondary">' +
                    (item.stockDisplay ? '<span class="item-stock">' + escapeHtml(item.stockDisplay) + '</span>' : '') +
                    (item.warehouse ? '<span class="item-warehouse">' + escapeHtml(item.warehouse) + '</span>' : '') +
                  '</div>'
                : '') +
              (hasTertiaryLine
                ? '<div class="item-tertiary">' + escapeHtml(item.arrivageRef) + '</div>'
                : '') +
            '</article>';
        }).join("");

        bindItemCopyHandlers();
      }

      function onLoadFailure(error) {
        const message = error && error.message ? error.message : String(error || "Erreur inconnue");
        els.status.className = "status error";
        els.status.textContent = message;
        els.countBadge.textContent = "!";
        els.list.innerHTML = "";
      }

      function bindItemCopyHandlers() {
        Array.prototype.forEach.call(els.list.querySelectorAll(".item"), function(node) {
          node.addEventListener("click", function() {
            copyReferenceFromNode(node);
          });

          node.addEventListener("keydown", function(event) {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              copyReferenceFromNode(node);
            }
          });
        });
      }

      function copyReferenceFromNode(node) {
        const reference = String(node.getAttribute("data-reference") || "").trim();
        if (!reference) return;

        const previousStatus = els.status.textContent;
        Promise.resolve(copyText(reference))
          .then(function() {
            showTemporaryStatus("Copié : " + reference, previousStatus, false);
          })
          .catch(function() {
            showTemporaryStatus("Copie impossible : " + reference, previousStatus, true);
          });
      }

      function showTemporaryStatus(message, previousStatus, isError) {
        if (restoreStatusTimeout) {
          clearTimeout(restoreStatusTimeout);
          restoreStatusTimeout = null;
        }

        els.status.className = isError ? "status error" : "status";
        els.status.textContent = message;

        restoreStatusTimeout = setTimeout(function() {
          els.status.className = "status";
          els.status.textContent = previousStatus;
          restoreStatusTimeout = null;
        }, 1500);
      }

      function copyText(text) {
        if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
          return navigator.clipboard.writeText(text);
        }

        return new Promise(function(resolve, reject) {
          try {
            const textarea = document.createElement("textarea");
            textarea.value = text;
            textarea.setAttribute("readonly", "");
            textarea.style.position = "fixed";
            textarea.style.opacity = "0";
            textarea.style.pointerEvents = "none";
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();

            const ok = document.execCommand("copy");
            document.body.removeChild(textarea);

            if (ok) resolve();
            else reject(new Error("copy failed"));
          } catch (error) {
            reject(error);
          }
        });
      }

      function escapeHtml(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/\"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      init();
    </script>
  </body>
</html>
