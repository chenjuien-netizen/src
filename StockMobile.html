<!DOCTYPE html>
<html class="light" lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>SZFASHION | Inventaire</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-secondary-fixed-variant": "#4e5c71",
              "inverse-on-surface": "#9a9d9f",
              "on-secondary-fixed": "#324053",
              "background": "#f7f9fb",
              "tertiary-container": "#dad6f7",
              "surface-variant": "#d9e4ea",
              "on-surface-variant": "#566166",
              "on-tertiary-fixed": "#393751",
              "on-tertiary-container": "#4b4a65",
              "on-tertiary": "#fcf7ff",
              "surface-bright": "#f7f9fb",
              "surface-container-lowest": "#ffffff",
              "error-dim": "#4e0309",
              "primary-fixed-dim": "#ccd4ee",
              "surface-tint": "#565e74",
              "outline": "#717c82",
              "tertiary-fixed": "#dad6f7",
              "secondary-fixed-dim": "#c7d5ed",
              "primary-fixed": "#dae2fd",
              "primary-container": "#dae2fd",
              "tertiary-fixed-dim": "#ccc9e9",
              "inverse-surface": "#0b0f10",
              "on-background": "#2a3439",
              "on-surface": "#2a3439",
              "on-primary-fixed": "#373f54",
              "on-primary-fixed-variant": "#535b71",
              "tertiary": "#5e5c78",
              "surface-container-highest": "#d9e4ea",
              "secondary-container": "#d5e3fc",
              "surface-container": "#e8eff3",
              "surface": "#f7f9fb",
              "secondary-fixed": "#d5e3fc",
              "secondary": "#526074",
              "error-container": "#fe8983",
              "tertiary-dim": "#52506b",
              "on-secondary-container": "#455367",
              "on-error-container": "#752121",
              "inverse-primary": "#dae2fd",
              "surface-container-low": "#f0f4f7",
              "on-primary-container": "#4a5167",
              "surface-dim": "#cfdce3",
              "outline-variant": "#a9b4b9",
              "on-primary": "#f7f7ff",
              "surface-container-high": "#e1e9ee",
              "on-error": "#fff7f6",
              "on-secondary": "#f8f8ff",
              "secondary-dim": "#465468",
              "on-tertiary-fixed-variant": "#55536f",
              "primary-dim": "#4a5268",
              "error": "#9f403d",
              "primary": "#565e74"
            },
            fontFamily: {
              headline: ["Inter", "sans-serif"],
              body: ["Inter", "sans-serif"],
              label: ["Inter", "sans-serif"]
            },
            borderRadius: {
              DEFAULT: "0px",
              lg: "0px",
              xl: "0px",
              full: "9999px"
            },
            boxShadow: {
              ledger: "0 1px 0 rgba(113, 124, 130, 0.12)"
            }
          }
        }
      };
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 20;
        font-size: 18px;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        min-height: max(100dvh, 100%);
        font-family: "Inter", sans-serif;
        background-color: #f7f9fb;
      }
    </style>
  </head>
  <body class="bg-background text-on-surface antialiased">
    <script id="inventory-boot" type="application/json"><?!= initialBootJson ?></script>

    <header class="fixed inset-x-0 top-0 z-50 flex h-14 items-center justify-between border-b border-slate-200 bg-slate-50 px-4">
      <div class="flex items-center gap-3">
        <button aria-label="Menu" class="rounded-full p-1 text-slate-700 transition-colors duration-150 hover:bg-slate-100">
          <span class="material-symbols-outlined">menu</span>
        </button>
        <div>
          <p class="text-[10px] font-bold uppercase tracking-[0.24em] text-slate-500">Stock Ledger</p>
          <h1 class="text-lg font-extrabold uppercase tracking-tight text-slate-900">SZFASHION</h1>
        </div>
      </div>
      <div class="flex items-center gap-1">
        <button aria-label="Rafraîchir" class="rounded-full p-1 text-slate-700 transition-colors duration-150 hover:bg-slate-100" id="refreshButton" type="button">
          <span class="material-symbols-outlined">refresh</span>
        </button>
      </div>
    </header>

    <main class="min-h-screen pb-20 pt-14">
      <section class="border-b border-outline-variant/20 bg-surface-container-low px-3 py-2 shadow-ledger">
        <div class="flex items-center gap-2">
          <span class="material-symbols-outlined text-on-surface-variant">search</span>
          <input autocomplete="off" class="w-full border-none bg-transparent p-0 text-[11px] font-medium tracking-tight text-on-surface placeholder:text-outline focus:ring-0" id="searchInput" placeholder="RECHERCHE RÉFÉRENCE / STOCK..." type="search" />
          <span class="hidden rounded-full border border-outline-variant/30 px-2 py-0.5 text-[9px] font-bold uppercase tracking-[0.2em] text-on-surface-variant sm:inline-flex" id="sortBadge">REF ASC</span>
        </div>
      </section>

      <section class="border-b border-outline-variant/30 bg-surface-container-high">
        <div class="flex divide-x divide-outline-variant/30">
          <button class="flex flex-1 items-center justify-center gap-2 py-2 transition-colors duration-150 hover:bg-surface-container-highest" id="toggleFilterButton" type="button">
            <span class="material-symbols-outlined !text-[16px] text-on-surface-variant">filter_list</span>
            <span class="text-[10px] font-bold uppercase tracking-widest text-on-surface-variant">Filtrer</span>
          </button>
          <button class="flex flex-1 items-center justify-center gap-2 py-2 transition-colors duration-150 hover:bg-surface-container-highest" id="toggleSortButton" type="button">
            <span class="material-symbols-outlined !text-[16px] text-on-surface-variant">sort</span>
            <span class="text-[10px] font-bold uppercase tracking-widest text-on-surface-variant">Trier</span>
          </button>
        </div>

        <div class="hidden border-t border-outline-variant/20 px-3 py-3" id="utilityPanel">
          <div class="grid gap-3 sm:grid-cols-2">
            <label class="block">
              <span class="mb-1 block text-[10px] font-bold uppercase tracking-[0.2em] text-on-surface-variant">Etat stock</span>
              <select class="w-full border-outline-variant/30 bg-surface-container-lowest text-[12px] font-medium text-on-surface" id="stockStateFilter">
                <option value="all">Tous</option>
                <option value="positive">En stock</option>
                <option value="zero">Zero</option>
              </select>
            </label>
            <label class="block">
              <span class="mb-1 block text-[10px] font-bold uppercase tracking-[0.2em] text-on-surface-variant">Tri</span>
              <select class="w-full border-outline-variant/30 bg-surface-container-lowest text-[12px] font-medium text-on-surface" id="sortSelect">
                <option value="ref_asc">Ref asc</option>
                <option value="ref_desc">Ref desc</option>
                <option value="stock_first">Stock d'abord</option>
              </select>
            </label>
            <label class="block sm:col-span-2" id="warehouseFilterWrap">
              <span class="mb-1 block text-[10px] font-bold uppercase tracking-[0.2em] text-on-surface-variant">Entrepot</span>
              <select class="w-full border-outline-variant/30 bg-surface-container-lowest text-[12px] font-medium text-on-surface" id="warehouseFilter">
                <option value="">Tous</option>
              </select>
            </label>
          </div>
        </div>
      </section>

      <section class="border-b border-outline-variant/30 bg-surface-container-high px-3 py-2">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <div class="flex min-w-0 flex-wrap items-center gap-2">
            <div class="flex items-center gap-1 border border-outline-variant/20 bg-surface-container-lowest px-2 py-0.5">
              <span class="material-symbols-outlined !text-[12px] text-primary">calendar_today</span>
              <span class="text-[9px] font-bold tracking-tight text-primary" id="summaryDate">--/--/----</span>
            </div>
            <div class="flex items-center gap-2 text-[9px] font-bold uppercase tracking-[0.18em] text-on-surface-variant">
              <span id="summaryRefs">0 refs</span>
              <span class="text-outline-variant/40">//</span>
              <span id="summaryPositive">0 stock</span>
              <span class="text-outline-variant/40">//</span>
              <span id="summaryZero">0 zero</span>
              <span class="text-outline-variant/40">//</span>
              <span id="summaryTotals">0 箱 0 件</span>
            </div>
          </div>
          <div class="text-right text-[9px] font-bold uppercase tracking-[0.2em] text-on-surface-variant" id="summaryStatus">Pret</div>
        </div>
        <div class="mt-2 flex flex-wrap gap-1" id="activeFilters"></div>
      </section>

      <section class="bg-outline-variant/20">
        <div class="grid grid-cols-2 gap-px bg-outline-variant/20 min-[720px]:grid-cols-3 min-[980px]:grid-cols-4" id="inventoryGrid">
          <?!= initialListMarkup ?>
        </div>
        <div class="hidden border-t border-outline-variant/20 bg-surface-container-lowest px-4 py-5 text-center" id="emptyState">
          <p class="text-[12px] font-semibold uppercase tracking-[0.18em] text-on-surface-variant">Aucun resultat</p>
          <p class="mt-1 text-[12px] text-on-surface-variant">Ajuste la recherche ou les filtres pour afficher des references.</p>
        </div>
      </section>
    </main>

    <nav class="fixed inset-x-0 bottom-0 z-50 flex h-16 items-stretch justify-around border-t border-slate-200 bg-slate-50">
      <a class="flex flex-col items-center justify-center px-2 py-1 text-slate-400" href="javascript:void(0)" tabindex="-1" aria-disabled="true">
        <span class="material-symbols-outlined">dashboard</span>
        <span class="mt-1 text-[10px] font-bold uppercase tracking-widest">Dashboard</span>
      </a>
      <a class="flex flex-col items-center justify-center bg-slate-200 px-2 py-1 text-slate-900" href="javascript:void(0)" aria-current="page">
        <span class="material-symbols-outlined">inventory_2</span>
        <span class="mt-1 text-[10px] font-bold uppercase tracking-widest">Inventaire</span>
      </a>
      <a class="flex flex-col items-center justify-center px-2 py-1 text-slate-400" href="javascript:void(0)" tabindex="-1" aria-disabled="true">
        <span class="material-symbols-outlined">history</span>
        <span class="mt-1 text-[10px] font-bold uppercase tracking-widest">Historique</span>
      </a>
    </nav>

    <script>
      (function() {
        const bootElement = document.getElementById("inventory-boot");
        const boot = bootElement ? JSON.parse(bootElement.textContent || "{}") : {};
        const initialPayload = boot && boot.payload ? boot.payload : {};

        const state = {
          items: Array.isArray(initialPayload.items) ? initialPayload.items.slice() : [],
          filters: initialPayload.filters || {},
          summary: initialPayload.summary || {},
          generatedAt: initialPayload.generatedAt || "",
          query: "",
          stockState: "all",
          warehouse: "",
          sort: initialPayload.ui && initialPayload.ui.defaultSort ? initialPayload.ui.defaultSort : "ref_asc",
          isRefreshing: false,
          filterPanelOpen: false,
          lastError: ""
        };

        const els = {
          grid: document.getElementById("inventoryGrid"),
          emptyState: document.getElementById("emptyState"),
          searchInput: document.getElementById("searchInput"),
          refreshButton: document.getElementById("refreshButton"),
          toggleFilterButton: document.getElementById("toggleFilterButton"),
          toggleSortButton: document.getElementById("toggleSortButton"),
          utilityPanel: document.getElementById("utilityPanel"),
          stockStateFilter: document.getElementById("stockStateFilter"),
          warehouseFilter: document.getElementById("warehouseFilter"),
          warehouseFilterWrap: document.getElementById("warehouseFilterWrap"),
          sortSelect: document.getElementById("sortSelect"),
          sortBadge: document.getElementById("sortBadge"),
          summaryDate: document.getElementById("summaryDate"),
          summaryRefs: document.getElementById("summaryRefs"),
          summaryPositive: document.getElementById("summaryPositive"),
          summaryZero: document.getElementById("summaryZero"),
          summaryTotals: document.getElementById("summaryTotals"),
          summaryStatus: document.getElementById("summaryStatus"),
          activeFilters: document.getElementById("activeFilters")
        };

        function escapeHtml(value) {
          return String(value == null ? "" : value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");
        }

        function renderItemMarkup(item) {
          const reference = item && item.reference ? item.reference : "-";
          const stockDisplay = item && item.stockDisplay ? item.stockDisplay : "-";
          const accentClass = item && item.stockState === "positive" ? "border-emerald-400/50" : "border-rose-400/50";
          const stockClass = item && item.stockState === "positive" ? "text-primary" : "text-on-surface-variant";

          return '' +
            '<article class="inventory-card bg-surface-container-lowest relative border-l-4 ' + accentClass + ' flex min-h-[4.25rem] flex-col justify-between px-2.5 py-2 transition-colors duration-150 hover:bg-surface-container" data-reference="' + escapeHtml(reference) + '" data-stock-display="' + escapeHtml(stockDisplay) + '" data-stock-state="' + escapeHtml(item && item.stockState ? item.stockState : "zero") + '">' +
              '<div class="flex items-start justify-between gap-2">' +
                '<span class="truncate pr-2 text-[12px] font-bold tracking-tight text-on-surface">' + escapeHtml(reference) + '</span>' +
                '<span class="material-symbols-outlined shrink-0 text-outline-variant !text-[14px]">inventory_2</span>' +
              '</div>' +
              '<div class="mt-2">' +
                '<span class="block truncate text-[13px] font-medium ' + stockClass + '">' + escapeHtml(stockDisplay) + '</span>' +
              '</div>' +
            '</article>';
        }

        function formatDateLabel(isoText) {
          if (!isoText) return "--/--/----";
          const date = new Date(isoText);
          if (Number.isNaN(date.getTime())) return "--/--/----";
          return new Intl.DateTimeFormat("fr-FR", {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
          }).format(date);
        }

        function normalizeText(value) {
          return String(value || "").toLowerCase().trim();
        }

        function toPositiveNumber(value) {
          const numeric = Number(value);
          return Number.isFinite(numeric) && numeric > 0 ? numeric : 0;
        }

        function parseFraction(text) {
          const normalized = String(text || "").trim().replace(/\s+/g, "");
          if (!normalized) return 0;
          const fractionMatch = normalized.match(/^(\d+)\/(\d+)$/);
          if (fractionMatch) {
            const numerator = Number(fractionMatch[1]);
            const denominator = Number(fractionMatch[2]);
            return denominator > 0 ? numerator / denominator : 0;
          }
          const numeric = Number(normalized.replace(",", "."));
          return Number.isFinite(numeric) && numeric > 0 ? numeric : 0;
        }

        function formatMetricNumber(value) {
          const numeric = Number(value || 0);
          if (!Number.isFinite(numeric) || numeric <= 0) return "0";
          const rounded = Math.round(numeric * 100) / 100;
          return Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(2).replace(/\.?0+$/, "");
        }

        function computeInventoryTotals_(items) {
          return (items || []).reduce(function(acc, item) {
            const tail = toPositiveNumber(item && item.tail);
            const unitsPerBox = toPositiveNumber(item && item.unitsPerBox);
            const itemBoxes = toPositiveNumber(item && item.itemBoxes);
            const fractionValue = toPositiveNumber(item && item.fractionValue) || parseFraction(item && item.fractionText);
            const colisage = toPositiveNumber(item && item.colisage);
            const itemPieces = tail + ((unitsPerBox > 0) ? ((unitsPerBox * itemBoxes) + (unitsPerBox * fractionValue)) : 0);

            acc.totalPieces += itemPieces;
            if (tail > 0) acc.totalBoxes += 1;

            if (unitsPerBox > 0) {
              acc.totalBoxes += itemBoxes + fractionValue;
            }

            if (colisage > 0) {
              acc.totalPacks += itemPieces / colisage;
              acc.hasPackData = true;
            } else {
              acc.allItemsHaveColisage = false;
            }

            return acc;
          }, {
            totalBoxes: 0,
            totalPieces: 0,
            totalPacks: 0,
            hasPackData: false,
            allItemsHaveColisage: true
          });
        }

        function getActiveFilterLabels() {
          const labels = [];
          if (state.query) labels.push("Recherche: " + state.query);
          if (state.stockState === "positive") labels.push("En stock");
          if (state.stockState === "zero") labels.push("Zero");
          if (state.warehouse) labels.push(state.warehouse);
          return labels;
        }

        function sortItems(items) {
          const next = items.slice();
          if (state.sort === "ref_desc") {
            next.sort(function(a, b) {
              return String(b.reference || "").localeCompare(String(a.reference || ""));
            });
            return next;
          }

          if (state.sort === "stock_first") {
            next.sort(function(a, b) {
              const leftState = a && a.stockState === "positive" ? 0 : 1;
              const rightState = b && b.stockState === "positive" ? 0 : 1;
              if (leftState !== rightState) return leftState - rightState;
              return String(a.reference || "").localeCompare(String(b.reference || ""));
            });
            return next;
          }

          next.sort(function(a, b) {
            return String(a.reference || "").localeCompare(String(b.reference || ""));
          });
          return next;
        }

        function getVisibleItems() {
          const query = normalizeText(state.query);
          return sortItems(state.items.filter(function(item) {
            if (state.stockState !== "all" && String(item.stockState || "") !== state.stockState) return false;
            if (state.warehouse && String(item.warehouse || "") !== state.warehouse) return false;
            if (!query) return true;

            const haystack = [
              item.reference || "",
              item.stockDisplay || ""
            ].join(" ").toLowerCase();
            return haystack.indexOf(query) !== -1;
          }));
        }

        function renderActiveFilters() {
          const labels = getActiveFilterLabels();
          els.activeFilters.innerHTML = labels.map(function(label) {
            return '<span class="inline-flex items-center border border-outline-variant/20 bg-surface-container-lowest px-2 py-1 text-[9px] font-bold uppercase tracking-[0.16em] text-on-surface-variant">' + escapeHtml(label) + '</span>';
          }).join("");
        }

        function renderSummary(visibleItems) {
          const positiveCount = visibleItems.filter(function(item) {
            return item && item.stockState === "positive";
          }).length;
          const totals = computeInventoryTotals_(visibleItems);
          const totalLoaded = state.summary && state.summary.totalRows ? state.summary.totalRows : state.items.length;
          const refsText = state.summary && state.summary.isPartial && state.items.length < totalLoaded
            ? visibleItems.length + " / " + totalLoaded + " refs"
            : visibleItems.length + " refs";
          const summarySegments = [
            formatMetricNumber(totals.totalBoxes) + " 箱"
          ];

          if (totals.hasPackData && totals.allItemsHaveColisage && totals.totalPacks > 0) {
            summarySegments.push(formatMetricNumber(totals.totalPacks) + " 包");
          }
          summarySegments.push(formatMetricNumber(totals.totalPieces) + " 件");

          els.summaryDate.textContent = formatDateLabel(state.generatedAt || (state.summary && state.summary.generatedAt) || "");
          els.summaryRefs.textContent = refsText;
          els.summaryPositive.textContent = positiveCount + " stock";
          els.summaryZero.textContent = Math.max(0, visibleItems.length - positiveCount) + " zero";
          els.summaryTotals.textContent = summarySegments.join(" ");

          if (state.isRefreshing) {
            els.summaryStatus.textContent = "Refresh...";
          } else if (state.lastError) {
            els.summaryStatus.textContent = state.lastError;
          } else if (getActiveFilterLabels().length) {
            els.summaryStatus.textContent = "Filtres actifs";
          } else if (state.summary && state.summary.isPartial) {
            els.summaryStatus.textContent = "Lot initial";
          } else {
            els.summaryStatus.textContent = "Pret";
          }
        }

        function renderGrid() {
          const visibleItems = getVisibleItems();
          els.grid.innerHTML = visibleItems.map(renderItemMarkup).join("");
          els.emptyState.classList.toggle("hidden", visibleItems.length > 0);
          renderSummary(visibleItems);
          renderActiveFilters();
        }

        function syncUtilityPanel() {
          els.utilityPanel.classList.toggle("hidden", !state.filterPanelOpen);
          els.sortSelect.value = state.sort;
          els.stockStateFilter.value = state.stockState;
          els.sortBadge.textContent = state.sort === "ref_desc" ? "REF DESC" : (state.sort === "stock_first" ? "STOCK" : "REF ASC");
        }

        function populateWarehouseFilter() {
          const warehouses = state.filters && Array.isArray(state.filters.warehouses) ? state.filters.warehouses : [];
          els.warehouseFilter.innerHTML = '<option value="">Tous</option>' + warehouses.map(function(value) {
            return '<option value="' + escapeHtml(value) + '">' + escapeHtml(value) + '</option>';
          }).join("");
          els.warehouseFilter.value = state.warehouse;
          els.warehouseFilterWrap.classList.toggle("hidden", warehouses.length === 0);
        }

        function hydrate(payload) {
          state.items = Array.isArray(payload && payload.items) ? payload.items.slice() : [];
          state.filters = payload && payload.filters ? payload.filters : {};
          state.summary = payload && payload.summary ? payload.summary : {};
          state.generatedAt = payload && payload.generatedAt ? payload.generatedAt : "";
          state.lastError = "";
          populateWarehouseFilter();
          syncUtilityPanel();
          renderGrid();
        }

        function runRefresh(isAuto) {
          if (state.isRefreshing) return;
          if (typeof google === "undefined" || !google.script || !google.script.run) return;
          state.isRefreshing = true;
          state.lastError = "";
          renderSummary(getVisibleItems());

          google.script.run
            .withSuccessHandler(function(payload) {
              state.isRefreshing = false;
              hydrate(payload || {});
            })
            .withFailureHandler(function(error) {
              state.isRefreshing = false;
              state.lastError = error && error.message ? error.message : "Erreur de rafraichissement";
              renderGrid();
            })
            .StockWebApp_getList();

          if (isAuto) {
            els.summaryStatus.textContent = "Sync...";
          }
        }

        els.searchInput.addEventListener("input", function(event) {
          state.query = String(event.target.value || "").trim();
          renderGrid();
        });

        els.refreshButton.addEventListener("click", function() {
          runRefresh(false);
        });

        els.toggleFilterButton.addEventListener("click", function() {
          state.filterPanelOpen = !state.filterPanelOpen;
          syncUtilityPanel();
        });

        els.toggleSortButton.addEventListener("click", function() {
          state.filterPanelOpen = true;
          syncUtilityPanel();
          els.sortSelect.focus();
        });

        els.stockStateFilter.addEventListener("change", function(event) {
          state.stockState = event.target.value || "all";
          renderGrid();
        });

        els.warehouseFilter.addEventListener("change", function(event) {
          state.warehouse = event.target.value || "";
          renderGrid();
        });

        els.sortSelect.addEventListener("change", function(event) {
          state.sort = event.target.value || "ref_asc";
          syncUtilityPanel();
          renderGrid();
        });

        hydrate(initialPayload);

        if (state.summary && state.summary.isPartial) {
          window.setTimeout(function() {
            runRefresh(true);
          }, 250);
        }
      })();
    </script>
  </body>
</html>
